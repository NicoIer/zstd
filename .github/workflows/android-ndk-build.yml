name: Android NDK Build

on:
  pull_request:
    branches: [ dev, release, actionsTest ]
  push:
    branches: [ actionsTest, '*ndk*' ]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # tag=v6.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;27.0.12077973"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

    - name: Build with NDK
      run: |
        export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        make CC=aarch64-linux-android21-clang \
             AR=llvm-ar \
             RANLIB=llvm-ranlib \
             STRIP=llvm-strip

    - name: Build with CMake and NDK
      run: |
        mkdir -p build-android
        cd build-android
        cmake --version
        cmake ../build/cmake \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release \
          -DZSTD_BUILD_SHARED=ON \
          -DZSTD_BUILD_STATIC=ON
        cmake --build . --parallel

    - name: Collect Android artifacts
      run: |
        mkdir -p android-artifacts
        find build-android -name "libzstd.so*" -exec cp {} android-artifacts/ \;
        find build-android -name "libzstd.a" -exec cp {} android-artifacts/ \;
        ls -lh android-artifacts/

    - name: Upload Android shared libraries
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # tag=v5.0.0
      with:
        name: zstd-android-arm64-v8a
        path: android-artifacts/
        if-no-files-found: error
