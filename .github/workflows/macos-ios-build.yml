name: macOS and iOS Builds

on:
  pull_request:
    branches: [ dev, release, actionsTest ]
  push:
    branches: [ actionsTest, '*macos*', '*ios*' ]
  release:
    types:
      - published

permissions: read-all

jobs:
  build-macos:
    permissions:
      contents: write # to upload artifacts
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            name: macos-x86_64
          - arch: arm64
            name: macos-arm64

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # tag=v6.0.1

      - name: Display build info
        run: |
          cmake --version
          xcodebuild -version || true
          sw_vers

      - name: Build macOS library
        run: |
          cd lib
          make clean
          make lib -j$(sysctl -n hw.ncpu)

      - name: Collect macOS artifacts
        run: |
          mkdir -p macos-artifacts
          find lib \( -name "libzstd.dylib" -o -name "libzstd.*.dylib" \) -exec cp {} macos-artifacts/ \; || true
          cp lib/libzstd.a macos-artifacts/ || true
          ls -lh macos-artifacts/

      - name: Upload macOS libraries
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # tag=v5.0.0
        with:
          name: zstd-${{ matrix.name }}
          path: macos-artifacts/
          if-no-files-found: error

  build-ios:
    permissions:
      contents: write # to upload artifacts
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            platform: OS64
            name: ios-arm64
          - arch: x86_64
            platform: SIMULATOR64
            name: ios-simulator-x86_64

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # tag=v6.0.1

      - name: Display build info
        run: |
          cmake --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build iOS library with CMake
        run: |
          mkdir -p build-ios-${{ matrix.arch }}
          cd build-ios-${{ matrix.arch }}
          cmake ../build/cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DZSTD_BUILD_SHARED=ON \
            -DZSTD_BUILD_STATIC=ON \
            -DZSTD_BUILD_PROGRAMS=OFF
          cmake --build . --parallel

      - name: Collect iOS artifacts
        run: |
          mkdir -p ios-artifacts
          find build-ios-${{ matrix.arch }} \( -name "libzstd.dylib" -o -name "libzstd.*.dylib" \) -exec cp {} ios-artifacts/ \;
          find build-ios-${{ matrix.arch }} -name "libzstd.a" -exec cp {} ios-artifacts/ \;
          ls -lh ios-artifacts/

      - name: Upload iOS libraries
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # tag=v5.0.0
        with:
          name: zstd-${{ matrix.name }}
          path: ios-artifacts/
          if-no-files-found: error

  build-universal:
    permissions:
      contents: write # to upload artifacts
    runs-on: macos-latest
    needs: [build-macos]

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # tag=v6.0.1

      - name: Build Universal macOS library
        run: |
          mkdir -p build-universal
          cd build-universal
          cmake ../build/cmake \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DZSTD_BUILD_SHARED=ON \
            -DZSTD_BUILD_STATIC=ON
          cmake --build . --parallel

      - name: Verify Universal binary
        run: |
          find build-universal \( -name "libzstd.dylib" -o -name "libzstd.*.dylib" \) -exec lipo -info {} \;
          find build-universal -name "libzstd.a" -exec lipo -info {} \;

      - name: Collect Universal artifacts
        run: |
          mkdir -p universal-artifacts
          find build-universal \( -name "libzstd.dylib" -o -name "libzstd.*.dylib" \) -exec cp {} universal-artifacts/ \;
          find build-universal -name "libzstd.a" -exec cp {} universal-artifacts/ \;
          ls -lh universal-artifacts/

      - name: Upload Universal macOS libraries
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # tag=v5.0.0
        with:
          name: zstd-macos-universal
          path: universal-artifacts/
          if-no-files-found: error

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd universal-artifacts
          tar -czf zstd-${{ github.ref_name }}-macos-universal.tar.gz libzstd.* libzstd.a
          gh release upload "${{ github.ref_name }}" zstd-${{ github.ref_name }}-macos-universal.tar.gz --clobber
